<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- PRELOAD HERO IMAGE -->
    <link
      rel="preload"
      as="image"
      href="/hero-bg.jpg"
      fetchpriority="high"
    />

    <!-- SEO -->
    <title>FluxFame - AI Automation & Web Solutions</title>

    <meta
      name="description"
      content="FluxFame helps businesses grow with AI automation and modern web solutions, including workflow automation, CRM systems, AI-powered customer interactions, custom websites, and high-converting landing pages."
    />

    <meta
      name="keywords"
      content="FluxFame, AI automation agency, web solutions, web development agency, CRM automation, AI workflows, business automation, website development, landing page development, custom websites, marketing automation"
    />

    <meta name="author" content="FluxFame" />

    <meta name="robots" content="index, follow" />

    <!-- CANONICAL -->
    <link
      rel="canonical"
      href="https://fluxfame.site/"
    />

    <!-- FAVICON -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />

    <link
      rel="shortcut icon"
      href="/favicon.ico"
    />

    <!-- OPEN GRAPH -->
    <meta
      property="og:title"
      content="FluxFame - AI Automation & Web Solutions"
    />

    <meta
      property="og:description"
      content="FluxFame helps businesses automate smarter and build better with AI-powered automation, CRM systems, intelligent workflows, custom websites, and conversion-focused landing pages."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://fluxfame.site/"
    />

    <meta
      property="og:site_name"
      content="FluxFame"
    />

    <meta
      property="og:image"
      content="https://fluxfame.site/og-image.png"
    />

    <meta
      property="og:image:width"
      content="1352"
    />

    <meta
      property="og:image:height"
      content="768"
    />

    <!-- TWITTER CARD -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="FluxFame - AI Automation & Web Solutions"
    />

    <meta
      name="twitter:description"
      content="AI automation and modern web solutions for businesses, including intelligent workflows, CRM systems, custom websites, and high-converting landing pages."
    />

    <meta
      name="twitter:image"
      content="https://fluxfame.site/og-image.png"
    />

    <!-- THEME COLOR -->
    <meta
      name="theme-color"
      content="#000000"
    />

    <!-- ORGANIZATION SCHEMA -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FluxFame",
        "url": "https://fluxfame.site/",
        "logo": "https://fluxfame.site/favicon.ico",
        "description": "FluxFame is an AI automation and web development agency helping businesses grow with workflow automation, CRM systems, AI-powered customer interactions, custom websites, and high-converting landing pages.",
        "sameAs": [
          "https://www.facebook.com/profile.php?id=61590684362355",
          "https://www.instagram.com/fluxfame01/"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
